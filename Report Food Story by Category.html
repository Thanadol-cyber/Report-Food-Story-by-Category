<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FoodStory Sales Dashboard</title>
  
  <!-- โหลด Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- โหลด React และ ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- โหลด Babel สำหรับแปลง JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* CSS สำหรับ Animation เพิ่มเติม */
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes zoomIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
    .fade-in { animation: fadeIn 0.4s ease-in-out forwards; }
    .zoom-in { animation: zoomIn 0.3s ease-out forwards; }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    /* ซ่อน Scrollbar แต่ยังเลื่อนได้ */
    .hide-scrollbar::-webkit-scrollbar {
        display: none;
    }
    .hide-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- เริ่มต้นเขียน React ใน HTML ด้วย Babel -->
  <script type="text/babel">
    const { useState, useCallback, useEffect } = React;

    // ==========================================
    // ชุดไอคอน (แปลงจาก Lucide-React มาเป็น SVG Components เพื่อให้ใช้ใน HTML ได้เลย)
    // ==========================================
    const IconWrapper = ({ size = 24, className = '', fill = 'none', children }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill={fill} stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        {children}
      </svg>
    );
    const UploadCloud = (p) => <IconWrapper {...p}><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/><path d="M12 12v9"/><path d="m16 16-4-4-4 4"/></IconWrapper>;
    const ImageIcon = (p) => <IconWrapper {...p}><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></IconWrapper>;
    const X = (p) => <IconWrapper {...p}><path d="M18 6 6 18"/><path d="m6 6 12 12"/></IconWrapper>;
    const FileSpreadsheet = (p) => <IconWrapper {...p}><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M8 13h2"/><path d="M14 13h2"/><path d="M8 17h2"/><path d="M14 17h2"/></IconWrapper>;
    const Trash2 = (p) => <IconWrapper {...p}><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></IconWrapper>;
    const Loader2 = (p) => <IconWrapper {...p}><path d="M21 12a9 9 0 1 1-6.219-8.56"/></IconWrapper>;
    const TableProperties = (p) => <IconWrapper {...p}><path d="M15 3v18"/><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18"/><path d="M3 15h18"/></IconWrapper>;
    const Trophy = (p) => <IconWrapper {...p}><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></IconWrapper>;
    const Download = (p) => <IconWrapper {...p}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></IconWrapper>;
    const PieChart = (p) => <IconWrapper {...p}><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></IconWrapper>;

    // ==========================================
    // ฟังก์ชันโหลด External Libraries
    // ==========================================
    const loadScript = (url, globalVar) => {
      return new Promise((resolve, reject) => {
        if (window[globalVar]) return resolve(window[globalVar]);
        const script = document.createElement('script');
        script.src = url;
        script.onload = () => resolve(window[globalVar]);
        script.onerror = () => reject(new Error(`Failed to load ${url}`));
        document.body.appendChild(script);
      });
    };

    // ==========================================
    // Logic ชุดสีและกราฟ
    // ==========================================
    const getCategoryColor = (index) => {
      const palettes = [
        { main: 'bg-gradient-to-b from-pink-400 to-pink-600 text-white border-b-4 border-r border-pink-800 shadow-[inset_0_2px_4px_rgba(255,255,255,0.4)]', cellBg: 'bg-pink-50/50', cellBgTotal: 'bg-gradient-to-b from-pink-200 to-pink-300 border-b-4 border-pink-500 shadow-[inset_0_2px_4px_rgba(255,255,255,0.6)]', textQ: 'text-pink-900 font-bold', textN: 'text-pink-900 font-bold', borderInner: 'border-pink-200', chartColor: '#ec4899', excelBase: 'FFEC4899', excelLight: 'FFFCE7F3' },
        { main: 'bg-gradient-to-b from-purple-400 to-purple-600 text-white border-b-4 border-r border-purple-800 shadow-[inset_0_2px_4px_rgba(255,255,255,0.4)]', cellBg: 'bg-purple-50/50', cellBgTotal: 'bg-gradient-to-b from-purple-200 to-purple-300 border-b-4 border-purple-500 shadow-[inset_0_2px_4px_rgba(255,255,255,0.6)]', textQ: 'text-purple-900 font-bold', textN: 'text-purple-900 font-bold', borderInner: 'border-purple-200', chartColor: '#a855f7', excelBase: 'FFA855F7', excelLight: 'FFF3E8FF' },
        { main: 'bg-gradient-to-b from-blue-400 to-blue-600 text-white border-b-4 border-r border-blue-800 shadow-[inset_0_2px_4px_rgba(255,255,255,0.4)]', cellBg: 'bg-blue-50/50', cellBgTotal: 'bg-gradient-to-b from-blue-200 to-blue-300 border-b-4 border-blue-500 shadow-[inset_0_2px_4px_rgba(255,255,255,0.6)]', textQ: 'text-blue-900 font-bold', textN: 'text-blue-900 font-bold', borderInner: 'border-blue-200', chartColor: '#3b82f6', excelBase: 'FF3B82F6', excelLight: 'FFDBEAFE' },
        { main: 'bg-gradient-to-b from-teal-400 to-teal-600 text-white border-b-4 border-r border-teal-800 shadow-[inset_0_2px_4px_rgba(255,255,255,0.4)]', cellBg: 'bg-teal-50/50', cellBgTotal: 'bg-gradient-to-b from-teal-200 to-teal-300 border-b-4 border-teal-500 shadow-[inset_0_2px_4px_rgba(255,255,255,0.6)]', textQ: 'text-teal-900 font-bold', textN: 'text-teal-900 font-bold', borderInner: 'border-teal-200', chartColor: '#14b8a6', excelBase: 'FF14B8A6', excelLight: 'FFCCFBF1' },
        { main: 'bg-gradient-to-b from-green-400 to-green-600 text-white border-b-4 border-r border-green-800 shadow-[inset_0_2px_4px_rgba(255,255,255,0.4)]', cellBg: 'bg-green-50/50', cellBgTotal: 'bg-gradient-to-b from-green-200 to-green-300 border-b-4 border-green-500 shadow-[inset_0_2px_4px_rgba(255,255,255,0.6)]', textQ: 'text-green-900 font-bold', textN: 'text-green-900 font-bold', borderInner: 'border-green-200', chartColor: '#22c55e', excelBase: 'FF22C55E', excelLight: 'FFDCFCE7' },
        { main: 'bg-gradient-to-b from-orange-400 to-orange-600 text-white border-b-4 border-r border-orange-800 shadow-[inset_0_2px_4px_rgba(255,255,255,0.4)]', cellBg: 'bg-orange-50/50', cellBgTotal: 'bg-gradient-to-b from-orange-200 to-orange-300 border-b-4 border-orange-500 shadow-[inset_0_2px_4px_rgba(255,255,255,0.6)]', textQ: 'text-orange-900 font-bold', textN: 'text-orange-900 font-bold', borderInner: 'border-orange-200', chartColor: '#f97316', excelBase: 'FFF97316', excelLight: 'FFFFEDD5' },
        { main: 'bg-gradient-to-b from-rose-400 to-rose-600 text-white border-b-4 border-r border-rose-800 shadow-[inset_0_2px_4px_rgba(255,255,255,0.4)]', cellBg: 'bg-rose-50/50', cellBgTotal: 'bg-gradient-to-b from-rose-200 to-rose-300 border-b-4 border-rose-500 shadow-[inset_0_2px_4px_rgba(255,255,255,0.6)]', textQ: 'text-rose-900 font-bold', textN: 'text-rose-900 font-bold', borderInner: 'border-rose-200', chartColor: '#f43f5e', excelBase: 'FFF43F5E', excelLight: 'FFFFE4E6' },
        { main: 'bg-gradient-to-b from-indigo-400 to-indigo-600 text-white border-b-4 border-r border-indigo-800 shadow-[inset_0_2px_4px_rgba(255,255,255,0.4)]', cellBg: 'bg-indigo-50/50', cellBgTotal: 'bg-gradient-to-b from-indigo-200 to-indigo-300 border-b-4 border-indigo-500 shadow-[inset_0_2px_4px_rgba(255,255,255,0.6)]', textQ: 'text-indigo-900 font-bold', textN: 'text-indigo-900 font-bold', borderInner: 'border-indigo-200', chartColor: '#6366f1', excelBase: 'FF6366F1', excelLight: 'FFE0E7FF' },
        { main: 'bg-gradient-to-b from-amber-400 to-amber-600 text-white border-b-4 border-r border-amber-800 shadow-[inset_0_2px_4px_rgba(255,255,255,0.4)]', cellBg: 'bg-amber-50/50', cellBgTotal: 'bg-gradient-to-b from-amber-200 to-amber-300 border-b-4 border-amber-500 shadow-[inset_0_2px_4px_rgba(255,255,255,0.6)]', textQ: 'text-amber-900 font-bold', textN: 'text-amber-900 font-bold', borderInner: 'border-amber-200', chartColor: '#f59e0b', excelBase: 'FFF59E0B', excelLight: 'FFFEF3C7' },
        { main: 'bg-gradient-to-b from-cyan-400 to-cyan-600 text-white border-b-4 border-r border-cyan-800 shadow-[inset_0_2px_4px_rgba(255,255,255,0.4)]', cellBg: 'bg-cyan-50/50', cellBgTotal: 'bg-gradient-to-b from-cyan-200 to-cyan-300 border-b-4 border-cyan-500 shadow-[inset_0_2px_4px_rgba(255,255,255,0.6)]', textQ: 'text-cyan-900 font-bold', textN: 'text-cyan-900 font-bold', borderInner: 'border-cyan-200', chartColor: '#06b6d4', excelBase: 'FF06B6D4', excelLight: 'FFCFFAFE' },
      ];
      return palettes[index % palettes.length];
    };

    const getBarStyle = (val, max, type) => {
      if (!val || !max || max <= 0) return {};
      const pct = Math.min(100, Math.max(0, (val / max) * 100));
      const color = type === 'qty' ? 'rgba(249, 115, 22, 0.25)' : 'rgba(234, 179, 8, 0.35)';
      return {
        backgroundImage: `linear-gradient(90deg, ${color} ${pct}%, transparent ${pct}%)`,
        backgroundRepeat: 'no-repeat'
      };
    };

    const InteractiveDonut = ({ data, totalNet }) => {
      const [hoverData, setHoverData] = useState(null);
      const size = 240;
      const cx = size / 2;
      const cy = size / 2;
      const strokeWidth = 50;
      const radius = (size - strokeWidth) / 2;
      const circumference = 2 * Math.PI * radius;
      let currentOffset = 0;

      return (
        <div className="relative flex items-center justify-center w-full min-h-[250px]">
          <svg id="donut-chart-svg" xmlns="http://www.w3.org/2000/svg" width={size} height={size} className="transform -rotate-90 drop-shadow-md">
            {data.map((item) => {
              const dashArray = `${(item.percent / 100) * circumference} ${circumference}`;
              const dashOffset = -currentOffset;
              currentOffset += (item.percent / 100) * circumference;
              return (
                <circle
                  key={item.catName}
                  cx={cx}
                  cy={cy}
                  r={radius}
                  fill="transparent"
                  stroke={item.color}
                  strokeWidth={strokeWidth}
                  strokeDasharray={dashArray}
                  strokeDashoffset={dashOffset}
                  className={`transition-all duration-300 cursor-pointer ${hoverData && hoverData.catName !== item.catName ? 'opacity-30' : 'opacity-100 hover:stroke-[55px]'}`}
                  onMouseEnter={() => setHoverData(item)}
                  onMouseLeave={() => setHoverData(null)}
                />
              );
            })}
          </svg>
          <div className="absolute inset-0 m-auto flex flex-col items-center justify-center pointer-events-none w-32 h-32 rounded-full bg-white shadow-[inset_0_2px_8px_rgba(0,0,0,0.1)] z-10 transition-all duration-300">
            {hoverData ? (
              <div className="flex flex-col items-center justify-center zoom-in">
                 <span className="text-[11px] font-bold text-gray-500 text-center px-2 truncate w-28">{hoverData.catName}</span>
                 <span className="text-base font-black mt-1 leading-tight" style={{color: hoverData.color}}>{hoverData.net.toLocaleString('th-TH', { minimumFractionDigits: 0, maximumFractionDigits: 0 })}</span>
                 <span className="text-xs font-bold text-gray-400 mt-0.5">{hoverData.percent.toFixed(1)}%</span>
              </div>
            ) : (
              <div className="flex flex-col items-center justify-center fade-in">
                 <span className="text-xs text-gray-500 font-bold">ยอดสุทธิรวม</span>
                 <span className="text-base font-black text-green-600 mt-1 leading-tight">{totalNet.toLocaleString('th-TH', { minimumFractionDigits: 0, maximumFractionDigits: 0 })}</span>
              </div>
            )}
          </div>
        </div>
      );
    };

    const App = () => {
      const [logo, setLogo] = useState(null);
      const [isDragging, setIsDragging] = useState(false);
      const [isLoading, setIsLoading] = useState(false);
      const [isExporting, setIsExporting] = useState(false); 
      const [reportData, setReportData] = useState(null);
      const [monthInfo, setMonthInfo] = useState({ name: '', enMonth: '', lastDay: 31 });

      // พยายามโหลดไฟล์ Logo.jpg หรือ logo.jpg จากโฟลเดอร์เดียวกันอัตโนมัติเมื่อเปิดหน้าเว็บ
      useEffect(() => {
        const defaultLogo = new window.Image();
        defaultLogo.onload = () => setLogo('./Logo.jpg'); // ถ้ามี Logo.jpg ให้โหลดเลย
        defaultLogo.onerror = () => {
          // ถ้าไม่มี ให้ลองหาแบบชื่อไฟล์ตัวพิมพ์เล็ก (logo.jpg)
          const defaultLogoLower = new window.Image();
          defaultLogoLower.onload = () => setLogo('./logo.jpg');
          defaultLogoLower.src = './logo.jpg';
        };
        defaultLogo.src = './Logo.jpg';
      }, []);

      const handleLogoUpload = (e) => {
        const file = e.target.files[0];
        if (file && file.type.startsWith('image/')) {
          const reader = new FileReader();
          reader.onload = (event) => setLogo(event.target.result);
          reader.readAsDataURL(file);
        }
      };

      const removeLogo = () => setLogo(null);
      const handleDragOver = (e) => { e.preventDefault(); setIsDragging(true); };
      const handleDragLeave = (e) => { e.preventDefault(); setIsDragging(false); };
      const handleDrop = (e) => {
        e.preventDefault();
        setIsDragging(false);
        const files = e.dataTransfer.files;
        if (files.length > 0) processFile(files[0]);
      };
      const handleFileSelect = (e) => {
        const files = e.target.files;
        if (files.length > 0) processFile(files[0]);
      };
      const resetData = () => { setReportData(null); };

      // ==========================================
      // ฟังก์ชัน Load ข้อมูลตัวอย่าง (Demo Data)
      // ==========================================
      const loadDemoData = () => {
        setIsLoading(true);
        setTimeout(() => {
          const generatedMock = [];
          const categories = ['เครื่องดื่มเย็น (Cold Bev)', 'เบเกอรี่ (Bakery)', 'อาหารจานเดียว (Main Dish)', 'ของทานเล่น (Appetizer)'];
          const items = {
            'เครื่องดื่มเย็น (Cold Bev)': ['อเมริกาโน่เย็น', 'ลาเต้เย็น', 'มัทฉะลาเต้เย็น', 'ชาไทยเย็น', 'โกโก้เย็น'],
            'เบเกอรี่ (Bakery)': ['เค้กส้ม', 'บราวนี่', 'ครัวซองต์เนยสด', 'พายแอปเปิล'],
            'อาหารจานเดียว (Main Dish)': ['ข้าวกะเพราหมูสับไข่ดาว', 'สปาเก็ตตี้คาโบนาร่า', 'ข้าวผัดต้มยำกุ้ง', 'ผัดไทยกุ้งสด'],
            'ของทานเล่น (Appetizer)': ['เฟรนช์ฟรายส์', 'ไก่ทอดสไตล์เกาหลี', 'ปอเปี๊ยะทอด']
          };

          for(let day=1; day<=31; day++) {
             categories.forEach(cat => {
                items[cat].forEach(item => {
                   // สุ่มยอดขายให้ดูเหมือนจริง
                   if(Math.random() > 0.3) {
                      const qty = Math.floor(Math.random() * 20) + 5;
                      const price = cat === 'เครื่องดื่มเย็น (Cold Bev)' ? 80 : cat === 'เบเกอรี่ (Bakery)' ? 120 : cat === 'อาหารจานเดียว (Main Dish)' ? 150 : 90;
                      generatedMock.push({
                         "วันที่": `${day.toString().padStart(2, '0')}/08/2024`,
                         "ชื่อสินค้า": item,
                         "หมวดสินค้า": cat,
                         "จำนวนการขาย": qty.toString(),
                         "ราคาสุทธิ": (qty * price).toString()
                      });
                   }
                });
             });
          }
          generatePivotData(generatedMock);
          setIsLoading(false);
        }, 800);
      };

      const process2DArray = (rows) => {
        let headerIndex = -1;
        for (let i = 0; i < Math.min(20, rows.length); i++) {
          const rowStr = (rows[i] || []).join('').toLowerCase();
          if (rowStr.includes('วันที่') && rowStr.includes('ชื่อสินค้า')) {
            headerIndex = i;
            break;
          }
        }
        if (headerIndex === -1) {
          alert('ไม่พบรูปแบบคอลัมน์ที่ถูกต้อง (ต้องมีคอลัมน์ "วันที่" และ "ชื่อสินค้า")');
          return null;
        }
        const headers = rows[headerIndex].map(h => (h || '').toString().trim());
        const data = [];
        for (let i = headerIndex + 1; i < rows.length; i++) {
          const row = rows[i];
          if (!row || row.length === 0 || !row.some(cell => cell !== undefined && cell !== null && cell !== '')) continue;
          let rowObj = {};
          headers.forEach((header, index) => {
            rowObj[header] = row[index] !== undefined ? row[index] : '';
          });
          data.push(rowObj);
        }
        return data;
      };

      const processFile = async (file) => {
        const isExcelOrCSV = file.name.endsWith('.csv') || file.name.endsWith('.xlsx') || file.name.endsWith('.xls');
        if (!isExcelOrCSV) {
          alert('กรุณาอัปโหลดไฟล์นามสกุล .xlsx, .xls หรือ .csv เท่านั้น');
          return;
        }
        setIsLoading(true);
        try {
          const XLSX = await loadScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js', 'XLSX');
          const reader = new FileReader();
          reader.onload = (e) => {
            try {
              const dataBuffer = e.target.result;
              let workbook;
              if (file.name.toLowerCase().endsWith('.csv')) {
                const text = new TextDecoder("utf-8").decode(dataBuffer);
                workbook = XLSX.read(text, { type: 'string', raw: false });
              } else {
                workbook = XLSX.read(dataBuffer, { type: 'array', raw: false });
              }
              const worksheet = workbook.Sheets[workbook.SheetNames[0]];
              const rows = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: '' });
              
              const parsedData = process2DArray(rows);
              if (parsedData) generatePivotData(parsedData);
            } catch (err) {
              console.error(err);
              alert('รูปแบบข้อมูลในไฟล์มีปัญหา กรุณาตรวจสอบไฟล์อีกครั้ง');
            } finally {
              setIsLoading(false);
            }
          };
          reader.onerror = () => { alert('อ่านไฟล์ไม่สำเร็จ'); setIsLoading(false); };
          reader.readAsArrayBuffer(file);
        } catch (error) {
          console.error(error);
          alert('ไม่สามารถโหลดตัวอ่านไฟล์ได้ (ต้องต่ออินเทอร์เน็ต)');
          setIsLoading(false);
        }
      };

      const generatePivotData = (data) => {
        const pivot = {};
        const grandTotal = { 
          W1: { qty: 0, net: 0 }, W2: { qty: 0, net: 0 }, 
          W3: { qty: 0, net: 0 }, W4: { qty: 0, net: 0 }, 
          W5: { qty: 0, net: 0 }, Total: { qty: 0, net: 0 } 
        };

        let maxDayFound = 0; 
        let monthStr = '';
        let enMonthStr = '';

        data.forEach(row => {
          const dateStr = (row['วันที่'] || '').toString().trim();
          const itemName = (row['ชื่อสินค้า'] || '').toString().trim();
          let category = (row['หมวดสินค้า'] || '').toString().trim() || 'ไม่มีหมวดหมู่';
          
          const qtyStr = (row['จำนวนการขาย'] || '0').toString().replace(/,/g, '');
          const netStr = (row['ราคาสุทธิ'] || '0').toString().replace(/,/g, '');
          const qty = parseFloat(qtyStr || 0);
          const net = parseFloat(netStr || 0);

          if (!dateStr || !itemName || itemName.includes('เทสระบบ')) return;

          const parts = dateStr.split(/[-/]/);
          if (parts.length >= 2) {
            let day = parseInt(parts[0], 10);
            let month = parseInt(parts[1], 10);
            let year = parseInt(parts[2], 10);

            if (month > 12) { const temp = day; day = month; month = temp; }
            if (year > 2500) year -= 543;
            if (year < 100) year += 2000;
            
            if (!isNaN(day)) {
               if (day > maxDayFound) maxDayFound = day;
               if (year && month) {
                  const thMonths = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
                  const enMonths = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
                  monthStr = `${thMonths[month-1]} ${year}`;
                  enMonthStr = enMonths[month-1];
               }
            }

            let week = 'W5';
            if (day >= 1 && day <= 7) week = 'W1';
            else if (day >= 8 && day <= 14) week = 'W2';
            else if (day >= 15 && day <= 21) week = 'W3';
            else if (day >= 22 && day <= 28) week = 'W4';

            if (!pivot[category]) {
              pivot[category] = {
                items: {},
                total: {
                  W1: { qty: 0, net: 0 }, W2: { qty: 0, net: 0 }, 
                  W3: { qty: 0, net: 0 }, W4: { qty: 0, net: 0 }, 
                  W5: { qty: 0, net: 0 }, Total: { qty: 0, net: 0 }
                }
              };
            }

            if (!pivot[category].items[itemName]) {
              pivot[category].items[itemName] = {
                W1: { qty: 0, net: 0 }, W2: { qty: 0, net: 0 }, 
                W3: { qty: 0, net: 0 }, W4: { qty: 0, net: 0 }, 
                W5: { qty: 0, net: 0 }, Total: { qty: 0, net: 0 }
              };
            }

            pivot[category].items[itemName][week].qty += qty;
            pivot[category].items[itemName][week].net += net;
            pivot[category].items[itemName].Total.qty += qty;
            pivot[category].items[itemName].Total.net += net;

            pivot[category].total[week].qty += qty;
            pivot[category].total[week].net += net;
            pivot[category].total.Total.qty += qty;
            pivot[category].total.Total.net += net;

            grandTotal[week].qty += qty;
            grandTotal[week].net += net;
            grandTotal.Total.qty += qty;
            grandTotal.Total.net += net;
          }
        });

        const sortedPivot = {};
        Object.keys(pivot).sort().forEach(catKey => {
          const catItems = pivot[catKey].items;
          const maxMetrics = {
            W1: { qty: 0, net: 0 }, W2: { qty: 0, net: 0 }, 
            W3: { qty: 0, net: 0 }, W4: { qty: 0, net: 0 }, 
            W5: { qty: 0, net: 0 }, Total: { qty: 0, net: 0 }
          };

          Object.values(catItems).forEach(item => {
            ['W1', 'W2', 'W3', 'W4', 'W5', 'Total'].forEach(w => {
              if (item[w].qty > maxMetrics[w].qty) maxMetrics[w].qty = item[w].qty;
              if (item[w].net > maxMetrics[w].net) maxMetrics[w].net = item[w].net;
            });
          });

          sortedPivot[catKey] = {
            total: pivot[catKey].total,
            maxMetrics: maxMetrics,
            items: Object.keys(catItems)
              .sort((a, b) => catItems[b].Total.qty - catItems[a].Total.qty)
              .reduce((obj, itemKey) => {
                obj[itemKey] = catItems[itemKey];
                return obj;
              }, {})
          };
        });

        setMonthInfo({ name: monthStr, enMonth: enMonthStr, lastDay: maxDayFound > 0 ? maxDayFound : 31 });
        setReportData({ categories: sortedPivot, grandTotal });
      };

      const formatNum = (num, isCurrency = false) => {
        if (num === 0 || !num) return '-';
        return num.toLocaleString('th-TH', { 
          minimumFractionDigits: isCurrency ? 2 : 0,
          maximumFractionDigits: isCurrency ? 2 : 0
        });
      };

      const maxDay = monthInfo.lastDay > 0 ? monthInfo.lastDay : 31;
      const mSuffix = monthInfo.enMonth ? ` ${monthInfo.enMonth}` : '';
      const activeWeeks = [];
      
      if (maxDay >= 1) activeWeeks.push({ id: 'W1', label: `1-${Math.min(7, maxDay)}${mSuffix}` });
      if (maxDay > 7) activeWeeks.push({ id: 'W2', label: `8-${Math.min(14, maxDay)}${mSuffix}` });
      if (maxDay > 14) activeWeeks.push({ id: 'W3', label: `15-${Math.min(21, maxDay)}${mSuffix}` });
      if (maxDay > 21) activeWeeks.push({ id: 'W4', label: `22-${Math.min(28, maxDay)}${mSuffix}` });
      if (maxDay > 28) activeWeeks.push({ id: 'W5', label: `29-${maxDay}${mSuffix}` });

      if (activeWeeks.length === 0) activeWeeks.push({ id: 'W1', label: `1-7${mSuffix}` });
      const colSpanGroup = activeWeeks.length + 1;

      const generateSummaryAndChart = () => {
        if (!reportData) return null;
        const totalNetSales = reportData.grandTotal.Total.net;
        const summaryList = Object.entries(reportData.categories)
          .map(([catName, catData], idx) => {
            const net = catData.total.Total.net;
            const qty = catData.total.Total.qty;
            const percent = totalNetSales > 0 ? (net / totalNetSales) * 100 : 0;
            return { catName, net, qty, percent, color: getCategoryColor(idx).chartColor };
          })
          .sort((a, b) => b.net - a.net);

        return (
          <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 mb-8 mt-4 page-break-inside-avoid">
            <div className="lg:col-span-7 bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
              <div className="bg-gradient-to-r from-gray-800 to-gray-700 p-4 border-b">
                <h3 className="font-bold text-white flex items-center gap-2">
                  <PieChart size={18} className="text-yellow-400" /> สรุปยอดรวมตามหมวดสินค้า (เรียงตามยอดขาย)
                </h3>
              </div>
              <div className="overflow-x-auto hide-scrollbar">
                <table className="w-full text-sm text-left whitespace-nowrap">
                  <thead className="bg-gray-50 text-gray-600 font-semibold border-b">
                    <tr>
                      <th className="p-3">หมวดสินค้า</th>
                      <th className="p-3 text-right">จำนวนขายรวม</th>
                      <th className="p-3 text-right">ยอดขายสุทธิ</th>
                      <th className="p-3 text-right">% สัดส่วน</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-gray-100">
                    {summaryList.map((item) => (
                      <tr key={item.catName} className="hover:bg-gray-50/50">
                        <td className="p-3 font-medium flex items-center gap-2">
                          <div className="w-3 h-3 rounded-full shadow-sm" style={{ backgroundColor: item.color }}></div>
                          {item.catName}
                        </td>
                        <td className="p-3 text-right text-gray-700">{formatNum(item.qty)}</td>
                        <td className="p-3 text-right font-bold text-green-700">{formatNum(item.net, true)}</td>
                        <td className="p-3 text-right text-gray-500">{item.percent.toFixed(1)}%</td>
                      </tr>
                    ))}
                  </tbody>
                  <tfoot className="bg-gray-50 border-t-2 border-gray-200 font-bold">
                    <tr>
                      <td className="p-3">ผลรวมทั้งหมด</td>
                      <td className="p-3 text-right text-blue-700">{formatNum(reportData.grandTotal.Total.qty)}</td>
                      <td className="p-3 text-right text-green-700">{formatNum(reportData.grandTotal.Total.net, true)}</td>
                      <td className="p-3 text-right">100%</td>
                    </tr>
                  </tfoot>
                </table>
              </div>
            </div>

            <div className="lg:col-span-5 bg-white rounded-2xl shadow-sm border border-gray-200 p-6 flex flex-col items-center justify-center relative">
              <h3 className="font-bold text-gray-700 mb-2 absolute top-4 left-6">สัดส่วนยอดขายตามหมวด</h3>
              <div className="mt-4 w-full flex justify-center">
                 <InteractiveDonut data={summaryList} totalNet={totalNetSales} />
              </div>
              <div className="mt-6 flex flex-wrap justify-center gap-x-4 gap-y-2 text-xs">
                {summaryList.map(item => (
                  <div key={`leg-${item.catName}`} className="flex items-center gap-1.5">
                    <div className="w-2.5 h-2.5 rounded-sm" style={{ backgroundColor: item.color }}></div>
                    <span className="text-gray-600">{item.catName}</span>
                  </div>
                ))}
              </div>
            </div>
          </div>
        );
      };

      const getChartBase64 = () => {
        return new Promise((resolve) => {
          const svg = document.getElementById('donut-chart-svg');
          if (!svg) return resolve(null);
          try {
            const svgData = new XMLSerializer().serializeToString(svg);
            const canvas = document.createElement('canvas');
            canvas.width = 400;
            canvas.height = 400;
            const ctx = canvas.getContext('2d');
            
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, 400, 400);

            const img = new Image();
            img.onload = () => {
              ctx.drawImage(img, 50, 50, 300, 300); 
              ctx.fillStyle = '#16a34a'; 
              ctx.font = 'bold 24px sans-serif';
              ctx.textAlign = 'center';
              ctx.textBaseline = 'middle';
              ctx.fillText(formatNum(reportData.grandTotal.Total.net, true), 200, 200);
              resolve(canvas.toDataURL('image/png'));
            };
            img.onerror = () => resolve(null);
            img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svgData)));
          } catch (err) {
            console.error(err);
            resolve(null);
          }
        });
      };

      const exportToExcel = async () => {
        if (!reportData) return;
        setIsExporting(true);

        try {
          const ExcelJS = await loadScript('https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js', 'ExcelJS');
          const wb = new ExcelJS.Workbook();
          const totalNetSales = reportData.grandTotal.Total.net;

          const wsSum = wb.addWorksheet('Summary', { views: [{ showGridLines: false }] });
          const chartBase64 = await getChartBase64();

          wsSum.columns = [
            { header: '', key: 'colorBox', width: 4 }, 
            { header: 'หมวดสินค้า', key: 'cat', width: 35 },
            { header: 'จำนวนขายรวม', key: 'qty', width: 20 },
            { header: 'ยอดขายสุทธิ', key: 'net', width: 20 },
            { header: '% สัดส่วน', key: 'pct', width: 15 }
          ];

          const sumHeader = wsSum.getRow(2);
          sumHeader.values = ['', 'สรุปยอดรวมตามหมวดสินค้า (เรียงตามยอดขาย)', 'จำนวนขายรวม', 'ยอดขายสุทธิ', '% สัดส่วน'];
          sumHeader.eachCell((c, colNum) => {
            if(colNum > 1) {
              c.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF374151' } }; 
              c.font = { color: { argb: 'FFFFFFFF' }, bold: true };
              c.alignment = { horizontal: colNum === 2 ? 'left' : 'right', vertical: 'middle' };
            }
          });
          sumHeader.height = 25;

          const summaryList = Object.entries(reportData.categories).map(([catName, catData], idx) => {
            return { catName, catData, colorData: getCategoryColor(idx) };
          }).sort((a, b) => b.catData.total.Total.net - a.catData.total.Total.net);

          summaryList.forEach((item) => {
            const net = item.catData.total.Total.net;
            const pct = totalNetSales > 0 ? (net / totalNetSales) * 100 : 0;
            const row = wsSum.addRow({
              colorBox: '', cat: item.catName, qty: item.catData.total.Total.qty, net: net, pct: pct.toFixed(2) + '%'
            });
            row.getCell(1).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: item.colorData.excelBase } };
            row.getCell(2).font = { bold: true };
            row.getCell(4).font = { bold: true, color: { argb: 'FF15803D' } }; 
            row.getCell(5).font = { color: { argb: 'FF6B7280' } }; 
          });

          const gtSumRow = wsSum.addRow({
            colorBox: '', cat: 'ผลรวมทั้งหมด', qty: reportData.grandTotal.Total.qty, net: totalNetSales, pct: '100%'
          });
          gtSumRow.eachCell((c, colNum) => {
            if(colNum > 1) {
              c.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFF9FAFB' } };
              c.border = { top: { style: 'thin', color: { argb: 'FFD1D5DB' } }, bottom: { style: 'thick', color: { argb: 'FFD1D5DB' } } };
              c.font = { bold: true };
            }
          });
          gtSumRow.getCell(4).font = { bold: true, color: { argb: 'FF15803D' } };

          if (chartBase64) {
            const imageId = wb.addImage({ base64: chartBase64, extension: 'png' });
            wsSum.addImage(imageId, { tl: { col: 6, row: 1 }, ext: { width: 300, height: 300 } });
          }

          const wsDet = wb.addWorksheet('Details', { views: [{ showGridLines: false }] }); 
          const row1Data = ['ป้ายชื่อแถว (หมวด/ชื่อสินค้า)', 'ผลรวมของ จำนวนการขาย', ...Array(colSpanGroup-1).fill(''), 'ผลรวมของ ราคาสุทธิ', ...Array(colSpanGroup-1).fill('')];
          const row1 = wsDet.addRow(row1Data);
          
          wsDet.mergeCells(1, 1, 2, 1); 
          wsDet.mergeCells(1, 2, 1, 2 + colSpanGroup - 1); 
          wsDet.mergeCells(1, 2 + colSpanGroup, 1, 2 + colSpanGroup * 2 - 1); 

          row1.getCell(1).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFE5E7EB' } }; 
          row1.getCell(2).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFF97316' } }; 
          row1.getCell(2 + colSpanGroup).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFEAB308' } }; 
          row1.eachCell(c => { c.font = { bold: true }; c.alignment = { horizontal: 'center', vertical: 'middle' }; });

          const header2Vals = [''];
          activeWeeks.forEach(wk => header2Vals.push(wk.label));
          header2Vals.push('ผลรวมทั้งหมด');
          activeWeeks.forEach(wk => header2Vals.push(wk.label));
          header2Vals.push('ผลรวมทั้งหมด');
          const row2 = wsDet.addRow(header2Vals);

          row2.eachCell((cell, colNum) => {
             if (colNum > 1) {
                const isQty = colNum < 2 + colSpanGroup;
                const isTotal = colNum === 1 + colSpanGroup || colNum === 1 + colSpanGroup * 2;
                cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: isQty ? (isTotal ? 'FFEA580C' : 'FFFFEDD5') : (isTotal ? 'FFEAB308' : 'FFFEF08A') } };
                cell.font = { bold: true, color: { argb: isTotal && isQty ? 'FFFFFFFF' : 'FF000000'} };
                cell.alignment = { horizontal: 'center' };
             }
          });

          Object.entries(reportData.categories).forEach(([catName, catData], catIdx) => {
            const theme = getCategoryColor(catIdx);
            const catRow = wsDet.addRow([catName, ...Array(colSpanGroup*2).fill('')]);
            catRow.getCell(1).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: theme.excelBase } };
            catRow.getCell(1).font = { bold: true, color: { argb: 'FFFFFFFF' } };

            Object.entries(catData.items).forEach(([itemName, itemData], idx) => {
              let prefix = '    ';
              if (idx === 0) prefix = '    (1) ';
              else if (idx === 1) prefix = '    (2) ';
              else if (idx === 2) prefix = '    (3) ';
              
              const itemRowData = [prefix + itemName];
              activeWeeks.forEach(wk => itemRowData.push(itemData[wk.id].qty || '-'));
              itemRowData.push(itemData.Total.qty || '-');
              activeWeeks.forEach(wk => itemRowData.push(itemData[wk.id].net || '-'));
              itemRowData.push(itemData.Total.net || '-');
              
              const itemRow = wsDet.addRow(itemRowData);
              itemRow.getCell(1).font = { bold: true, color: { argb: 'FF1F2937' } }; 
              itemRow.getCell(colSpanGroup + 1).font = { bold: true }; 
              itemRow.getCell(colSpanGroup * 2 + 1).font = { bold: true }; 
            });

            const subRowData = [`รวม ${catName}`];
            activeWeeks.forEach(wk => subRowData.push(catData.total[wk.id].qty || '-'));
            subRowData.push(catData.total.Total.qty || '-');
            activeWeeks.forEach(wk => subRowData.push(catData.total[wk.id].net || '-'));
            subRowData.push(catData.total.Total.net || '-');
            
            const subRow = wsDet.addRow(subRowData);
            subRow.eachCell(c => {
              c.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: theme.excelLight } };
              c.font = { bold: true };
            });

            wsDet.addRow([]); 
          });

          const gtRowData = ['ผลรวมทั้งหมด (Grand Total)'];
          activeWeeks.forEach(wk => gtRowData.push(reportData.grandTotal[wk.id].qty || '-'));
          gtRowData.push(reportData.grandTotal.Total.qty || '-');
          activeWeeks.forEach(wk => gtRowData.push(reportData.grandTotal[wk.id].net || '-'));
          gtRowData.push(reportData.grandTotal.Total.net || '-');
          
          const gtRow = wsDet.addRow(gtRowData);
          gtRow.eachCell(c => {
            c.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF1F2937' } }; 
            c.font = { bold: true, color: { argb: 'FFFFFFFF' } }; 
          });

          wsDet.getColumn(1).width = 40;
          for(let i=2; i<=1+(colSpanGroup*2); i++) wsDet.getColumn(i).width = 12;

          const buffer = await wb.xlsx.writeBuffer();
          const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
          const url = window.URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `Weekly_Report_${monthInfo.enMonth || 'Export'}.xlsx`;
          a.click();
          window.URL.revokeObjectURL(url);

        } catch (err) {
          console.error(err);
          alert('เกิดข้อผิดพลาดในการสร้างไฟล์ Excel');
        } finally {
          setIsExporting(false);
        }
      };

      return (
        <>
          {(isLoading || isExporting) && (
            <div className="fixed inset-0 bg-black/40 backdrop-blur-sm z-[100] flex flex-col items-center justify-center">
              <div className="bg-white p-8 rounded-xl shadow-2xl flex flex-col items-center">
                <Loader2 size={40} className="text-blue-600 animate-spin mb-4" />
                <p className="text-lg font-bold text-gray-800">
                  {isLoading ? 'กำลังประมวลผล...' : 'กำลังสร้างไฟล์เพื่อดาวน์โหลด...'}
                </p>
                <p className="text-sm text-gray-500 mt-1">กรุณารอสักครู่ ระบบกำลังจัดรูปแบบให้สวยงาม</p>
              </div>
            </div>
          )}

          <div id="printable-report" className="min-h-screen bg-gray-50 text-gray-800 pb-12">
            <header className={`bg-white shadow-sm border-b border-gray-200 px-6 py-4 flex flex-wrap gap-4 justify-between items-center ${isExporting ? 'static' : 'sticky top-0 z-40'}`}>
              <div className="flex items-center gap-4">
                <div className="relative group cursor-pointer w-16 h-16 rounded-full border-2 border-dashed border-gray-300 flex items-center justify-center bg-white overflow-hidden hover:border-blue-400 transition-colors shrink-0 shadow-sm">
                  {logo ? (
                    <>
                      <img src={logo} alt="Logo" className="w-full h-full object-cover" />
                      {!isExporting && (
                        <div onClick={removeLogo} className="absolute inset-0 bg-black/50 hidden group-hover:flex items-center justify-center text-white">
                          <X size={20} />
                        </div>
                      )}
                    </>
                  ) : (
                    !isExporting && (
                      <label className="cursor-pointer flex flex-col items-center justify-center w-full h-full text-gray-400 hover:text-blue-500">
                        <ImageIcon size={20} />
                        <span className="text-[10px] mt-1 text-center leading-tight">เพิ่ม<br/>Logo</span>
                        <input type="file" className="hidden" accept="image/*" onChange={handleLogoUpload} />
                      </label>
                    )
                  )}
                </div>
                
                <div className="ml-2">
                  <div className="inline-flex items-center gap-3 bg-gradient-to-b from-gray-800 to-black border-b-4 border-gray-900 text-yellow-400 px-4 md:px-5 py-2.5 rounded-xl shadow-[0_4px_6px_rgba(0,0,0,0.3),inset_0_1px_1px_rgba(255,255,255,0.2)]">
                    <TableProperties size={26} className="text-yellow-400 drop-shadow-md hidden md:block" />
                    <h1 className="text-lg md:text-2xl font-extrabold tracking-wide drop-shadow-md">
                      รายงานยอดขายตามหมวด
                    </h1>
                  </div>
                  <p className="text-sm text-gray-500 mt-2 font-medium">ระบบประมวลผลตารางแยกสัปดาห์เทียบ จำนวน และ ยอดขาย</p>
                </div>
              </div>

              {reportData && !isExporting && (
                <div className="flex items-center gap-2">
                  <button onClick={exportToExcel} className="flex items-center gap-2 bg-green-600 hover:bg-green-700 text-white px-4 py-2.5 rounded-lg text-sm font-bold shadow-sm transition-colors border border-green-800">
                    <Download size={18} /> Export Excel
                  </button>
                  <button onClick={resetData} className="flex items-center gap-2 bg-gray-100 hover:bg-red-100 text-gray-600 hover:text-red-600 px-4 py-2.5 rounded-lg text-sm font-bold transition-colors border border-gray-300 hover:border-red-300 ml-2">
                    <Trash2 size={18} /> ล้างข้อมูล
                  </button>
                </div>
              )}
            </header>

            <main className="p-4 md:p-6 max-w-[1600px] mx-auto">
              {!reportData && !isLoading && !isExporting && (
                <div className="max-w-3xl mx-auto mt-10">
                  <div 
                    onDragOver={handleDragOver}
                    onDragLeave={handleDragLeave}
                    onDrop={handleDrop}
                    className={`border-2 border-dashed rounded-xl p-8 md:p-12 flex flex-col items-center justify-center transition-all bg-white
                      ${isDragging ? 'border-blue-500 bg-blue-50 shadow-md' : 'border-gray-300 hover:border-blue-400 hover:bg-gray-50'}`}
                  >
                    <div className="w-20 h-20 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mb-6">
                      <FileSpreadsheet size={40} />
                    </div>
                    <h2 className="text-2xl font-semibold mb-2">อัปโหลดไฟล์รายงานจาก POS</h2>
                    <p className="text-gray-500 text-center mb-8 max-w-md leading-relaxed">
                      ลากไฟล์ <span className="font-semibold text-green-700">.xlsx, .xls</span> หรือ <span className="font-semibold text-blue-700">.csv</span> เข้ามาวางในกรอบนี้
                    </p>
                    
                    <div className="flex flex-col sm:flex-row gap-4">
                      <label className="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-lg font-medium cursor-pointer transition-colors shadow-sm flex items-center justify-center gap-2">
                        <UploadCloud size={20} />
                        อัปโหลดไฟล์ Excel / CSV
                        <input 
                          type="file" 
                          className="hidden" 
                          accept=".csv, application/vnd.openxmlformats-officedocument.spreadsheetml.sheet, application/vnd.ms-excel" 
                          onChange={handleFileSelect} 
                        />
                      </label>

                      {/* ปุ่มจำลองข้อมูล เพื่อการแสดงผลทันที */}
                      <button onClick={loadDemoData} className="bg-green-600 hover:bg-green-700 text-white px-6 py-3 rounded-lg font-medium cursor-pointer transition-colors shadow-sm flex items-center justify-center gap-2">
                        <PieChart size={20} />
                        ดูข้อมูลตัวอย่าง (Demo)
                      </button>
                    </div>
                  </div>
                </div>
              )}

              {reportData && (
                <div className="fade-in bg-gray-50">
                  {generateSummaryAndChart()}

                  <div className="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden mt-4">
                    <div className="bg-gray-50 p-4 border-b border-gray-200 flex justify-between items-center">
                      <div>
                        <h3 className="font-semibold text-gray-800 flex items-center gap-2">
                          <TableProperties size={18} className="text-blue-600"/>
                          รายละเอียดข้อมูลสินค้า
                        </h3>
                        {monthInfo.name && <p className="text-sm font-medium text-blue-700 mt-1">ยอดขายประจำเดือน: {monthInfo.name}</p>}
                      </div>
                    </div>

                    <div id="table-scroll-container" className="overflow-x-auto max-h-[85vh] relative w-full hide-scrollbar">
                      <table className="w-full text-sm text-right whitespace-nowrap border-collapse">
                        <thead className="sticky top-0 z-20 shadow-sm print:static">
                          <tr>
                            <th rowSpan="2" className="p-3 text-left font-bold text-gray-800 border-r border-b-4 border-gray-400 bg-gradient-to-b from-gray-100 to-gray-300 shadow-[inset_0_2px_4px_rgba(255,255,255,0.8)] sticky left-0 z-30 min-w-[200px] md:min-w-[250px] align-bottom print:static">
                              ป้ายชื่อแถว (หมวด/ชื่อสินค้า)
                            </th>
                            <th colSpan={colSpanGroup} className="p-2 text-center font-extrabold text-white border-r border-b-4 border-orange-600 bg-gradient-to-b from-orange-400 to-orange-500 shadow-[inset_0_2px_4px_rgba(255,255,255,0.6)] drop-shadow-sm text-base tracking-wide">
                              ผลรวมของ จำนวนการขาย
                            </th>
                            <th colSpan={colSpanGroup} className="p-2 text-center font-extrabold text-yellow-900 border-b-4 border-yellow-500 bg-gradient-to-b from-yellow-300 to-yellow-400 shadow-[inset_0_2px_4px_rgba(255,255,255,0.8)] drop-shadow-sm text-base tracking-wide">
                              ผลรวมของ ราคาสุทธิ
                            </th>
                          </tr>
                          <tr>
                            {activeWeeks.map((wk, idx) => (
                              <th key={`q-w-${idx}`} className="p-2 text-center text-xs font-bold text-orange-900 border-r border-b-[3px] border-orange-300 bg-gradient-to-b from-orange-50 to-orange-100 min-w-[60px] shadow-[inset_0_1px_2px_rgba(255,255,255,0.8)]">
                                {wk.label}
                              </th>
                            ))}
                            <th className="p-2 text-center text-xs font-bold text-white border-r border-b-[3px] border-orange-700 bg-gradient-to-b from-orange-500 to-orange-600 min-w-[80px] shadow-[inset_0_1px_2px_rgba(255,255,255,0.4)] drop-shadow-sm">
                              ผลรวมทั้งหมด
                            </th>
                            {activeWeeks.map((wk, idx) => (
                              <th key={`n-w-${idx}`} className="p-2 text-center text-xs font-bold text-yellow-900 border-r border-b-[3px] border-yellow-300 bg-gradient-to-b from-yellow-50 to-yellow-100 min-w-[70px] shadow-[inset_0_1px_2px_rgba(255,255,255,0.8)]">
                                {wk.label}
                              </th>
                            ))}
                            <th className="p-2 text-center text-xs font-bold text-yellow-900 border-b-[3px] border-yellow-600 bg-gradient-to-b from-yellow-400 to-yellow-500 min-w-[90px] shadow-[inset_0_1px_2px_rgba(255,255,255,0.4)] drop-shadow-sm">
                              ผลรวมทั้งหมด
                            </th>
                          </tr>
                        </thead>

                        {Object.entries(reportData.categories).map(([catName, catData], catIdx) => {
                          const theme = getCategoryColor(catIdx);
                          return (
                          <tbody key={catName} className="break-inside-avoid">
                            <tr className="font-bold bg-white">
                              <td className={`p-2 pl-3 text-left border-r sticky left-0 z-10 print:static ${theme.main}`}>
                                <span className="drop-shadow-md tracking-wide">{catName}</span>
                              </td>
                              {activeWeeks.map(wk => (<td key={`empty-q-${wk.id}`} className="p-2 border-r border-gray-100"></td>))}
                              <td className="p-2 border-r border-blue-100"></td>
                              {activeWeeks.map(wk => (<td key={`empty-n-${wk.id}`} className="p-2 border-r border-gray-100"></td>))}
                              <td className="p-2 border-r border-green-100"></td>
                            </tr>

                            {Object.entries(catData.items).map(([itemName, itemData], itemIndex) => (
                               <tr key={itemName} className="hover:bg-blue-50/40 border-b border-gray-100 bg-white group transition-colors">
                                 <td className="p-2 pl-4 text-left border-r border-gray-200 font-bold sticky left-0 z-10 print:static bg-white group-hover:bg-blue-50/40 transition-colors">
                                   <div className="flex items-center gap-3">
                                     <div className="w-14 shrink-0 flex justify-center">
                                       {itemIndex === 0 && (
                                         <div className="flex items-center justify-center gap-1.5 bg-gradient-to-b from-yellow-200 to-yellow-400 border border-yellow-500 rounded px-2 py-0.5 shadow-sm">
                                           <Trophy size={14} className="text-yellow-700" fill="currentColor" />
                                           <span className="text-xs font-black text-yellow-900">1</span>
                                         </div>
                                       )}
                                       {itemIndex === 1 && (
                                         <div className="flex items-center justify-center gap-1.5 bg-gradient-to-b from-gray-200 to-gray-300 border border-gray-400 rounded px-2 py-0.5 shadow-sm">
                                           <Trophy size={14} className="text-gray-600" fill="currentColor" />
                                           <span className="text-xs font-black text-gray-800">2</span>
                                         </div>
                                       )}
                                       {itemIndex === 2 && (
                                         <div className="flex items-center justify-center gap-1.5 bg-gradient-to-b from-orange-300 to-orange-400 border border-orange-500 rounded px-2 py-0.5 shadow-sm">
                                           <Trophy size={14} className="text-orange-800" fill="currentColor" />
                                           <span className="text-xs font-black text-orange-900">3</span>
                                         </div>
                                       )}
                                     </div>
                                     <span className={
                                       itemIndex === 0 ? "text-yellow-700 font-extrabold md:text-base" : 
                                       itemIndex === 1 ? "text-gray-700 font-extrabold" : 
                                       itemIndex === 2 ? "text-orange-800 font-extrabold" : 
                                       "text-gray-800"
                                     }>
                                       {itemName}
                                     </span>
                                   </div>
                                 </td>
                                 
                                 {activeWeeks.map(wk => (
                                   <td key={`it-q-${wk.id}`} className="p-2 border-r border-gray-100 text-gray-700">
                                     {formatNum(itemData[wk.id].qty)}
                                   </td>
                                 ))}
                                 <td className="p-2 border-r border-blue-100 bg-blue-50/30 font-bold text-gray-900" style={getBarStyle(itemData.Total.qty, catData.maxMetrics.Total.qty, 'qty')}>
                                   {formatNum(itemData.Total.qty)}
                                 </td>
                                 
                                 {activeWeeks.map(wk => (
                                   <td key={`it-n-${wk.id}`} className="p-2 border-r border-gray-100 text-gray-700">
                                     {formatNum(itemData[wk.id].net, true)}
                                   </td>
                                 ))}
                                 <td className="p-2 border-r border-green-100 bg-green-50/30 font-bold text-gray-900" style={getBarStyle(itemData.Total.net, catData.maxMetrics.Total.net, 'net')}>
                                   {formatNum(itemData.Total.net, true)}
                                 </td>
                               </tr>
                            ))}

                            <tr className="font-bold border-b-2 border-gray-300">
                              <td className={`p-2 pr-4 text-right border-r sticky left-0 z-10 print:static ${theme.cellBgTotal} text-gray-900`}>
                                <span className="drop-shadow-sm">รวม {catName}</span>
                              </td>
                              {activeWeeks.map(wk => (
                                <td key={`cat-q-${wk.id}`} className={`p-2 border-r ${theme.borderInner} ${theme.cellBg} ${theme.textQ}`}>{formatNum(catData.total[wk.id].qty)}</td>
                              ))}
                              <td className={`p-2 border-r ${theme.borderInner} ${theme.cellBgTotal} ${theme.textQ}`}>{formatNum(catData.total.Total.qty)}</td>
                              {activeWeeks.map(wk => (
                                <td key={`cat-n-${wk.id}`} className={`p-2 border-r ${theme.borderInner} ${theme.cellBg} ${theme.textN}`}>{formatNum(catData.total[wk.id].net, true)}</td>
                              ))}
                              <td className={`p-2 border-r ${theme.borderInner} ${theme.cellBgTotal} ${theme.textN}`}>{formatNum(catData.total.Total.net, true)}</td>
                            </tr>

                            <tr className="h-4 md:h-6 bg-gray-100/60 border-b border-gray-300 shadow-inner">
                              <td colSpan={activeWeeks.length * 2 + 3} className="border-none"></td>
                            </tr>
                          </tbody>
                          );
                        })}
                        
                        <tfoot className="sticky bottom-0 z-20 print:static">
                          <tr className="bg-gray-800 text-white font-bold shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)]">
                            <td className="p-3 pl-3 text-left border-r border-gray-700 sticky left-0 z-30 print:static bg-gray-800">
                              ผลรวมทั้งหมด (Grand Total)
                            </td>
                            {activeWeeks.map(wk => (
                              <td key={`gt-q-${wk.id}`} className="p-3 border-r border-gray-700 text-blue-200">{formatNum(reportData.grandTotal[wk.id].qty)}</td>
                            ))}
                            <td className="p-3 border-r border-gray-700 text-blue-300 bg-gray-700">{formatNum(reportData.grandTotal.Total.qty)}</td>
                            {activeWeeks.map(wk => (
                              <td key={`gt-n-${wk.id}`} className="p-3 border-r border-gray-700 text-green-200">{formatNum(reportData.grandTotal[wk.id].net, true)}</td>
                            ))}
                            <td className="p-3 text-green-300 bg-gray-700">{formatNum(reportData.grandTotal.Total.net, true)}</td>
                          </tr>
                        </tfoot>

                      </table>
                    </div>
                  </div>
                </div>
              )}
            </main>
          </div>
        </>
      );
    };

    // Render ตัว App ลงในหน้า HTML
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
